[package]
name = "gaia-interface"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "L6 sovereign interface — local session, CLI/HTTP adapters, orchestrator gateway"

[dependencies]
gaia-memos = { path = "../gaia-memos" }
gaia-orchestrator = { path = "../gaia-orchestrator" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
