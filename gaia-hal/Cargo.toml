[package]
name        = "gaia-hal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GAIA Hardware Abstraction Layer — cpu / memory / interrupts / timers / storage / network / gpu / sensors / platform"

[features]
default = []
# Enable per-subsystem stubs for targets that lack real hardware.
mock-storage = []
mock-network = []
mock-sensors = []
# Platform feature gates (enabled by build.rs or the integrator).
x86_64  = []
aarch64 = []
riscv64 = []

[dependencies]
thiserror  = "1"
log        = "0.4"

[dev-dependencies]
tempfile = "3"
