[package]
name = "gaia-agents"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "L5 agent policy runtime, Wasmtime proof, A2A handoff"

[dependencies]
gaia-kernel = { path = "../gaia-kernel" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
wasmtime = "25"
