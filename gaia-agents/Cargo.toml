[package]
name = "gaia-agents"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "L5 agent policy runtime, Wasmtime proof, pack, and A2A handoff"

[[bin]]
name = "gaia-agent"
path = "src/bin/gaia-agent.rs"

[dependencies]
gaia-kernel = { path = "../gaia-kernel" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
wasmtime = "25"
