[package]
name = "gaia-ingest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Earth Twin ingestion schema — the single auditable boundary through which every external byte enters GAIA."

[dependencies]
gaia-earth = { path = "../gaia-earth" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
sha2       = "0.10"
hex        = "0.4"
thiserror  = "1"
uuid       = { version = "1", features = ["v4"] }
