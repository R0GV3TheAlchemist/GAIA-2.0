name: knowledge-catalog

on:
  push:
    branches: [main]
    paths:
      - "docs/knowledge/**"
      - "scripts/validate_catalog.py"
      - ".github/workflows/knowledge-catalog.yml"
  pull_request:
    paths:
      - "docs/knowledge/**"
      - "scripts/validate_catalog.py"
      - ".github/workflows/knowledge-catalog.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate knowledge catalog (#697)
        run: python3 scripts/validate_catalog.py
