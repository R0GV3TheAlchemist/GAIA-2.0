name: anti-chaos-control

on:
  pull_request:
    paths:
      - 'docs/canon/**'
      - 'docs/ANTI_CHAOS_CONTROL_PLANE.md'
      - 'supabase/migrations/**'
      - 'proofs/**'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'proofs/**'

jobs:
  proof-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require proof artefacts for canon changes
        run: |
          set -euo pipefail
          if git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD | grep -E '^docs/canon/' >/dev/null 2>&1; then
            if ! git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD | grep -E '^proofs/PROOF_' >/dev/null 2>&1; then
              echo 'Canon changes require a proofs/PROOF_*.md artefact'
              exit 1
            fi
          fi
      - name: Migration files must be .sql
        run: |
          set -euo pipefail
          find supabase/migrations -type f ! -name '*.sql' | grep . && exit 1 || true
