name: Rust Unit Tests

on:
  push:
    branches: [ main, 'feat/**', 'fix/**' ]
    paths:
      - 'gaia-*/src/**'
      - 'gaia-*/tests/**'
      - 'gaia-*/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/regression/**'
      - '.github/workflows/rust-unit-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'gaia-*/src/**'
      - 'gaia-*/tests/**'
      - 'gaia-*/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/regression/**'
      - '.github/workflows/rust-unit-tests.yml'

jobs:
  rust-unit-tests:
    name: Rust Unit Tests — cargo test --workspace --lib (#844)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo test --workspace --lib
        run: cargo test --workspace --lib --no-fail-fast

      - name: cargo test -p gaia-integrity --test regression (#936)
        run: cargo test -p gaia-integrity --test regression --no-fail-fast

      - name: cargo clippy (warnings as errors)
        run: cargo clippy --workspace --lib -- -D warnings
