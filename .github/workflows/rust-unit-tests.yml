name: Rust Unit Tests

on:
  push:
    branches: [ main, 'feat/**', 'fix/**' ]
    paths:
      - 'gaia-*/src/**'
      - 'gaia-*/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-unit-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'gaia-*/src/**'
      - 'gaia-*/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-unit-tests.yml'

jobs:
  rust-unit-tests:
    name: Rust Unit Tests — cargo test --workspace --lib (#844)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo test --workspace --lib
        # --lib: runs only the #[cfg(test)] blocks inside each crate's lib.rs.
        # Integration tests (tests/ directories) are covered by #845.
        # --no-fail-fast: report all crate failures, not just the first.
        run: cargo test --workspace --lib --no-fail-fast

      - name: cargo clippy (warnings as errors)
        # Keep the workspace lint-clean. Any new warning introduced by a PR
        # is caught here before it reaches main.
        run: cargo clippy --workspace --lib -- -D warnings
