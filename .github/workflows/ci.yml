name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate AIP examples and schemas
        run: |
          python -m pip install jsonschema
          python gaia-spec/tools/validate_aip.py

  rust-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust SDK
        run: cargo test --manifest-path gaia-sdk/rust/Cargo.toml

  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Python SDK
        run: |
          python -m pip install -e "gaia-sdk/python[dev]"
          pytest -q gaia-sdk/python

  typescript-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test TypeScript SDK
        working-directory: gaia-sdk/typescript
        run: |
          npm install
          npm test

  rust-placeholders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Phase-1 crates not required yet
        run: |
          echo "gaia-kernel / gaia-sfs / gaia-memos cargo test is skipped until those crates exist (issue #14+)."

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Markdown presence check
        run: |
          test -f README.md
          test -f gaia-spec/README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
