[package]
name = "gaia-validate"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP service layer for the GAIA-2.0 human-gated correction loop"

[[bin]]
name = "gaia-validate"
path = "src/main.rs"

[lib]
name = "gaia_validate"
path = "src/lib.rs"

[dependencies]
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
thiserror    = "1"
clap         = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
