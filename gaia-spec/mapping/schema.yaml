# Mapping schema (#815 / #816 / #845).
# A correspondence is an interpretation. Empty mappings are valid.

version: 2
fields:
  - source_corpus
  - edition_or_translation
  - translator
  - date
  - excerpt_locator
  - extracted_structure
  - proposed_gaia_target
  - rationale
  - confidence   # high | medium | low | inconclusive | no_mapping
  - evidence_class
  - competing_interpretations
  - disconfirmation_conditions
  - reviewer
  - review_date
  - corpus_id
  - source_title
  - language
  - date_range
  - cultural_context
  - edition
  - scholarly_source
  - extracted_unit
  - gaia_candidate
  - null_result_notes
  - provenance_notes

evidence_class:
  - direct_textual_support
  - historical_contextual_support
  - structural_similarity
  - computational_utility
  - speculative_analogy

hermetic_markers:
  - emerald tablet
  - as above so below
  - solve et coagula
  - prima materia
