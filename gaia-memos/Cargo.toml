[package]
name = "gaia-memos"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "GAIA 2.0 MemOS: 5-tier persistent memory with hybrid search, decay, erasure, isolation, and sync"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
gaia-sfs = { path = "../gaia-sfs" }
gaia-ingest = { path = "../gaia-ingest" }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
