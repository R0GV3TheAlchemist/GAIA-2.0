[package]
name = "gaia-memos"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "GAIA 2.0 MemOS: MemCube store and five-tier hierarchy"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
gaia-sfs = { path = "../gaia-sfs" }
