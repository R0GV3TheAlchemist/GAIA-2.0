[package]
name = "gaia-memos"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "GAIA 2.0 MemOS: MemCube store, five-tier hierarchy, and Continuity"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
gaia-sfs = { path = "../gaia-sfs" }
rusqlite = { version = "0.32", features = ["bundled"] }
