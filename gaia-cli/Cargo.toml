[package]
name = "gaia-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gaia"
path = "src/main.rs"

[dependencies]
anyhow    = "1"
clap      = { version = "4", features = ["derive"] }
tokio     = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing   = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2"
