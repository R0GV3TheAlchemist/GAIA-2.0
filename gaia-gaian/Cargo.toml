[package]
name = "gaia-gaian"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "GAIAN consent, age-gate, and self-only rules. Not an avatar pipeline."

[features]
# Enable to link against a locally-built whisper.cpp via whisper-rs.
# Off by default so `cargo test --workspace` passes in CI without a model.
whisper = ["dep:whisper-rs"]

[dependencies]
# Only compiled when the `whisper` feature is enabled.  whisper-rs provides
# safe Rust bindings to whisper.cpp (tazz4843/whisper-rs).
whisper-rs = { version = "0.13", optional = true }
